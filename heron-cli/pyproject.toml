[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "heron-cli"
version = "0.1.0"
description = "Terminal stats for your Heron device"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Northsline" }]
keywords = ["heron", "network", "monitor", "dns", "iot"]

[project.scripts]
heron = "heron_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]